<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="und" dir="auto" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>SPLITTR Invite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="x-apple-disable-message-reformatting" />

    <!--[if gte mso 9]>
    <xml>
      <o:OfficeDocumentSettings xmlns:o="urn:schemas-microsoft-com:office:office">
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style type="text/css">
        /* Fonts - Hosted from Vercel */
        @font-face {
            font-family: 'Palatino';
            src: url('https://prowess-two.vercel.app/assets/Palatino.ttf') format('truetype');
            font-weight: normal;
        }

        @font-face {
            font-family: 'Optician Sans';
            src: url('https://prowess-two.vercel.app/assets/Optician-Sans.otf') format('opentype');
            font-weight: normal;
        }

        @font-face {
            font-family: 'Instrument Serif';
            src: url('https://prowess-two.vercel.app/assets/InstrumentSerif-Italic.ttf') format('truetype');
            font-weight: normal;
        }

        /* Dark Mode Consistency */
        .dark-mode .bg-000001 {
            background-color: #000001 !important;
        }

        .dark-mode .color-d6cfbf {
            color: #d6cfbf !important;
        }

        .dark-mode .bg-cc342c {
            background-color: #cc342c !important;
        }

        .dark-mode .color-9a9287 {
            color: #9a9287 !important;
        }

        @media (prefers-color-scheme: dark) {
            html:not(.light-mode) .bg-000001 {
                background-color: #000001 !important;
            }

            html:not(.light-mode) .color-d6cfbf {
                color: #d6cfbf !important;
            }

            html:not(.light-mode) .color-9a9287 {
                color: #9a9287 !important;
            }
        }

        /* Layout */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }

        .main-table {
            background-color: #000000;
            width: 600px;
            margin: 0 auto;
            border-spacing: 0;
            font-family: 'Optician Sans', Arial, sans-serif;
        }

        .hero-section {
            background-color: #000000;
            height: 394px;
            width: 600px;
        }

        .label-text {
            font-size: 16px;
            letter-spacing: 2.24px;
            color: #d6cfbf;
            text-transform: lowercase;
        }

        .headline {
            font-family: 'Instrument Serif', Georgia, serif;
            font-style: italic;
            font-size: 40px;
            color: #d6cfbf;
            font-weight: normal;
            margin: 0;
            line-height: 1.1;
        }

        .avatar {
            background-color: #191616;
            border: 1px solid rgba(214, 207, 191, 0.15);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            text-align: center;
            color: #d6cfbf;
            font-size: 18px;
        }

        .group-underline {
            background-color: #cc342c;
            height: 2px;
            width: 138px;
            margin: 0 auto;
        }

        .body-text {
            font-family: 'Palatino', Georgia, serif;
            font-size: 16px;
            color: #9a9287;
            line-height: 1.5;
            max-width: 281px;
            margin: 0 auto;
        }

        .join-button {
            background-color: #cc342c;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 0;
            display: block;
            width: 330px;
            text-align: center;
            letter-spacing: 2.56px;
            text-transform: uppercase;
            font-size: 15px;
        }

        .footer-text {
            color: #3b3b35;
            font-size: 16px;
            letter-spacing: 2.24px;
            text-transform: lowercase;
        }
    </style>
</head>

<body style="margin:0;padding:0;background-color:#000000;">
    <center style="width:100%;table-layout:fixed;background-color:#000000;">
        <table class="main-table" cellpadding="0" cellspacing="0" border="0" role="presentation">
            <!-- Hero and Top Bar -->
            <tr>
                <td class="hero-section" valign="top">
                    <!--[if gte mso 9]>
                <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;height:394px;">
                <v:fill type="frame" src="{{banner_url}}" color="#000000" />
                <v:textbox inset="0,0,0,0">
                <![endif]-->
                    <table width="100%" height="394" cellpadding="0" cellspacing="0" border="0"
                        style="background: url('{{banner_url}}') 50% / 100% no-repeat; height: 394px;">
                        <tr>
                            <td valign="top" style="padding: 20px 20px;">
                                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                    <tr>
                                        <td align="left" class="label-text">splittr</td>
                                        <td align="right" class="label-text">{{current_time}}</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                    <!--[if gte mso 9]>
                </v:textbox>
                </v:rect>
                <![endif]-->
                </td>
            </tr>

            <!-- Content Area -->
            <tr>
                <td align="center" style="padding: 40px 0 0 0;">
                    <h1 class="headline" style="padding-bottom: 10px;">You have been</h1>

                    <table cellpadding="0" cellspacing="0" border="0" style="padding-bottom: 10px;">
                        <tr>
                            <td class="headline" style="padding-right: 15px;">invited by</td>
                            <td class="avatar" valign="middle">{{inviter_initials}}</td>
                            <td class="headline" style="padding-left: 15px;">{{inviter_name}} to</td>
                        </tr>
                    </table>

                    <h1 class="headline" style="padding-bottom: 20px;">join the group</h1>

                    <!-- Group Name -->
                    <table cellpadding="0" cellspacing="0" border="0" align="center">
                        <tr>
                            <td class="headline"
                                style="font-size: 32px; font-family: 'Palatino', serif; font-style: normal; padding-bottom: 5px;">
                                {{group_name}}</td>
                        </tr>
                        <tr>
                            <td class="group-underline"></td>
                        </tr>
                    </table>

                    <!-- Body Text -->
                    <p class="body-text" style="padding: 30px 0;">
                        Your teammate has invited you to manage shared expenses on PROWESS Splitter. Click below to
                        create your account and start tracking.
                    </p>

                    <!-- CTA -->
                    <table align="center" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td>
                                <a href="{{invite_link}}" class="join-button">join</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td style="padding: 80px 20px 40px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td align="left" class="footer-text">new invite</td>
                            <td align="right" class="footer-text">from {{from_name}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </center>
</body>

</html>
